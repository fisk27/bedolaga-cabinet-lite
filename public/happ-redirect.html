<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:;">
<title>SUBO VPN</title>
<style>
  body { background: #0F0E0A; color: #FAFAF9; margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #fallback { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .card { background: #1C1A14; border: 1px solid rgba(250,250,249,0.07); border-radius: 24px; padding: 32px 24px; text-align: center; max-width: 360px; width: 100%; }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  p { color: #A8A29E; line-height: 1.45; margin: 0 0 24px; font-size: 14px; }
  a.btn { display: inline-block; background: #F2C12E; color: #1A1605; padding: 14px 24px; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<div id="fallback">
  <div class="card">
    <h1>Не удалось открыть Happ</h1>
    <p id="hint">Нажмите кнопку, чтобы попробовать ещё раз. Если приложение не установлено — установите его.</p>
    <a id="link" class="btn" href="#">Открыть в Happ</a>
  </div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var to = params.get('to');
  if (!to || !to.startsWith('happ://')) {
    document.getElementById('hint').textContent = 'Ссылка для подключения не передана. Откройте /lite/connect ещё раз.';
    document.getElementById('link').style.display = 'none';
    document.getElementById('fallback').style.display = 'flex';
    return;
  }
  document.getElementById('link').href = to;
  // Instant redirect
  window.location.replace(to);
  // If we're still here after 1.5s, show fallback UI (Happ probably not installed)
  setTimeout(function() {
    if (document.visibilityState === 'visible') {
      document.getElementById('fallback').style.display = 'flex';
    }
  }, 1500);
})();
</script>
</body>
</html>
